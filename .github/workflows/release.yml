name: release

# Cut a release by pushing a version tag:
#
#     # bump version in pyproject.toml to 0.1.1, commit, then:
#     git tag v0.1.1 && git push origin v0.1.1
#
# This workflow then: checks the tag matches pyproject's version, runs the full
# test suite, builds the sdist + wheel, publishes to PyPI via Trusted Publishing
# (OIDC -- no stored token), and cuts a GitHub Release with the artifacts.
#
# ONE-TIME PyPI SETUP (no secrets in GitHub): on pypi.org, go to the weft-usd
# project -> Settings -> Publishing -> "Add a new publisher" (GitHub):
#     Owner:        distancetozero
#     Repository:   weft
#     Workflow:     release.yml
#     Environment:  pypi
# After that, every v* tag publishes with no API token anywhere.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:        # allow a manual run (build + test only; publish still needs a tag)

permissions:
  contents: read

jobs:
  build:
    name: test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          echo "tag=$tag  pyproject=$ver"
          test "$tag" = "$ver" || { echo "::error::tag v$tag != pyproject version $ver"; exit 1; }

      - name: run the suite (numpy + usd-core)
        run: |
          pip install -e ".[dev]"
          pytest -q

      - name: build sdist + wheel
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI (trusted publishing)
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi            # the environment named in the PyPI trusted publisher
    permissions:
      id-token: write            # OIDC: mint a short-lived PyPI token, no secret stored
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true    # a version already on PyPI is a no-op, not a failure

  github-release:
    name: GitHub Release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write            # create the Release and attach artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)."
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" --notes "$notes" --verify-tag
