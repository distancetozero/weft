<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>weft loom</title>
<style>
  :root{color-scheme:dark; --bg:#17140f; --panel:#1e1a14; --line:#352e24;
        --ink:#efe7d8; --muted:#a79b86; --accent:#f2d79a; --prop:#9db0c0;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:13px/1.5 ui-sans-serif,system-ui,-apple-system,sans-serif;height:100vh;
       display:flex;flex-direction:column;overflow:hidden}
  header{padding:10px 14px;border-bottom:1px solid var(--line);
         display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font:600 14px ui-sans-serif,sans-serif;margin:0;letter-spacing:.3px}
  header h1 b{color:var(--accent)}
  .ctx{color:var(--muted);font:11px ui-monospace,monospace;max-width:40vw;
       overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin-left:auto}
  .chip{background:var(--panel);border:1px solid var(--line);border-radius:20px;
        padding:3px 10px;color:var(--muted);font-size:11px}
  .chip b{color:var(--ink)}

  main{flex:1;display:grid;grid-template-columns:1fr 0;min-height:0;transition:grid-template-columns .12s}
  main.cardopen{grid-template-columns:1fr 360px}
  #work{display:flex;flex-direction:column;min-height:0;overflow:hidden}

  .bar{padding:8px 13px;border-bottom:1px solid var(--line);display:flex;
       gap:16px;align-items:center;flex-wrap:wrap}
  .bar label{color:var(--muted);font-size:11px;text-transform:uppercase;
             letter-spacing:.6px;display:flex;gap:6px;align-items:center}
  select,input,button{font:12px ui-sans-serif;border-radius:7px;
       border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:5px 8px}
  button{cursor:pointer;background:var(--panel)}
  button:hover{border-color:var(--accent)}
  .hint{color:var(--muted);margin-left:auto;font-size:11px}

  #pivot{flex:1;overflow:auto;font:12px ui-monospace,monospace}
  .trow{display:flex;align-items:center;gap:8px;padding:2px 10px;cursor:pointer;
        border-bottom:1px solid #241f18;white-space:nowrap}
  .trow:hover{background:var(--panel)}
  .trow.sel{background:#2a2317}
  .tw{width:12px;color:var(--muted);flex:none;text-align:center}
  .tw.hit{cursor:pointer}
  .tn{flex:1;overflow:hidden;text-overflow:ellipsis}
  .tt{color:var(--prop);width:120px;flex:none;overflow:hidden;text-overflow:ellipsis}
  .tb{color:var(--muted);width:90px;flex:none;text-align:right;
      font-variant-numeric:tabular-nums}
  .ghead{display:flex;align-items:center;gap:8px;padding:4px 10px;cursor:pointer;
         background:var(--panel);border-bottom:1px solid var(--line);
         position:sticky;top:0}
  .ghead b{color:var(--accent)}
  .gcount{color:var(--muted);margin-left:auto}

  aside#card{background:var(--panel);border-left:1px solid var(--line);
             overflow:auto;padding:14px}
  aside#card h2{margin:0;font:600 15px ui-sans-serif}
  aside#card h3{margin:14px 0 4px;font:600 10px ui-sans-serif;
                text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
  aside#card .muted{color:var(--muted);font:11px ui-monospace,monospace;
                    word-break:break-all}
  aside#card ul{margin:0;padding:0;list-style:none;font:11px ui-monospace,monospace}
  aside#card li{padding:2px 0;border-bottom:1px solid var(--line);word-break:break-all}
  aside#card .rk{color:var(--prop)}
  aside#card a{color:var(--accent);cursor:pointer}
  aside#card .cardclose{float:right;padding:2px 8px}
  .row{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  .out{font:11px ui-monospace,monospace;color:var(--muted);white-space:pre-wrap;margin-top:8px}
  .muted{color:var(--muted)}
</style>
</head>
<body>
<script>/* STATIC */ window.LOOM_STATIC = window.LOOM_STATIC || false;</script>
<header>
  <h1>weft <b>loom</b></h1>
  <span class="ctx" id="ctx">—</span>
  <div class="chips" id="chips"></div>
</header>
<main id="main">
  <section id="work">
    <div class="bar">
      <label>Organize by
        <select id="organize-by">
          <option value="hierarchy">Hierarchy</option>
          <option value="type">Type</option>
          <option value="payload">Payload status</option>
          <option value="purpose">Purpose</option>
          <option value="bbox-bucket">Bbox size</option>
          <option value="material">Material (loads)</option>
        </select>
      </label>
      <label>Sort
        <select id="sortby">
          <option value="">—</option>
          <option value="bbox_volume">bbox ↓</option>
        </select>
      </label>
      <span class="hint" id="rowhint"></span>
    </div>
    <div id="pivot"><div class="muted" style="padding:14px">loading the stage…</div></div>
  </section>
  <aside id="card" hidden></aside>
</main>

<script>
const S = window.LOOM_STATIC;
const byId = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

// -- profile header ----------------------------------------------------------
(S ? fetch("profile.json") : fetch("/profile")).then(r=>r.json()).then(pf=>{
  byId("ctx").textContent = pf.context || "";
  byId("ctx").title = pf.context || "";
  byId("chips").innerHTML =
    `<span class="chip"><b>${pf.prims}</b> prims</span>` +
    `<span class="chip"><b>${pf.payloaded_pct}%</b> behind payloads</span>` +
    `<span class="chip"><b>${Object.keys(pf.native_relationship_kinds||{}).length}</b> rel kinds</span>`;
}).catch(()=>{});

// -- rows + hierarchy pivot --------------------------------------------------
let ROWS = [];
let KIDS = {};                       // parent path -> [rows]
let ROOTS = [];                      // top-level rows
const OPEN = new Set();              // expanded group paths
let SELECTED = null;

const parentOf = p => p.slice(0, p.lastIndexOf("/")) || "/";

function indexRows(){
  KIDS = {};
  const have = new Set(ROWS.map(r=>r.path));
  ROWS.forEach(r=>{ const par = parentOf(r.path); (KIDS[par]=KIDS[par]||[]).push(r); });
  ROOTS = ROWS.filter(r=> !have.has(parentOf(r.path)));
  ROOTS.forEach(r=> OPEN.add(r.path));     // default-expand the top level
}

function cell(r, depth){
  const hasKids = !!KIDS[r.path];
  const tw = hasKids ? (OPEN.has(r.path) ? "▾" : "▸") : "·";
  return `<div class="trow${SELECTED===r.path?" sel":""}" data-p="${esc(r.path)}" data-depth="${depth}">
    <span class="tw${hasKids?" hit":""}" style="margin-left:${depth*15}px">${tw}</span>
    <span class="tn">${esc(r.path.split("/").pop())}</span>
    <span class="tt">${esc(r.type)}</span>
    <span class="tb">${r.bbox_volume==null?"":Number(r.bbox_volume).toPrecision(3)}</span>
  </div>`;
}

function renderHierarchy(){
  const out = [];
  const walk = (list, depth) => list.forEach(r=>{
    out.push(cell(r, depth));
    if(OPEN.has(r.path) && KIDS[r.path]) walk(KIDS[r.path], depth+1);
  });
  walk(ROOTS, 0);
  const pv = byId("pivot");
  pv.innerHTML = out.join("") || '<div class="muted" style="padding:14px">no prims</div>';
  pv.querySelectorAll(".trow").forEach(el=>{
    const p = el.dataset.p;
    const tw = el.querySelector(".tw.hit");
    if(tw) tw.onclick = e=>{ e.stopPropagation();
      OPEN.has(p) ? OPEN.delete(p) : OPEN.add(p); renderHierarchy(); };
    el.onclick = ()=>{ SELECTED = p; openCard(p); renderHierarchy(); };
  });
}

// -- organize-by: pivot the table by any dimension ---------------------------
const GROUP_OPEN = new Set();
const bucket = v => v==null ? "(no bounds)"
  : v<1 ? "< 1" : v<100 ? "1 – 100" : v<1e4 ? "100 – 10k"
  : v<1e6 ? "10k – 1M" : "> 1M";
const CHEAP = {
  type:    r => r.type || "(untyped)",
  payload: r => r.has_payload ? "behind payload" : "loaded",
  purpose: r => r["attr:purpose"] || "(no purpose)",
  "bbox-bucket": r => bucket(r.bbox_volume),
};
const DIM_COLS = { purpose:["attr:purpose"], material:["material"] };
const EXPENSIVE = { material: r => r.material || "(no material bound)" };

function sortRows(rows){
  const k = byId("sortby").value;
  if(!k) return rows;
  return rows.slice().sort((a,b)=> (Number(b[k])||-Infinity) - (Number(a[k])||-Infinity));
}

function renderGroups(keyFn){
  const groups = {};
  ROWS.forEach(r=>{ const k = keyFn(r); (groups[k]=groups[k]||[]).push(r); });
  const names = Object.keys(groups).sort((a,b)=>{
    const ca = a.startsWith("("), cb = b.startsWith("(");   // "(no …)" catch-alls
    if(ca !== cb) return ca ? 1 : -1;                       // sink to the bottom
    return groups[b].length - groups[a].length;             // else biggest first
  });
  const out = [];
  names.forEach(name=>{
    const rows = groups[name];
    const vol = rows.reduce((s,r)=> s + (Number(r.bbox_volume)||0), 0);
    const open = GROUP_OPEN.has(name);
    out.push(`<div class="ghead" data-g="${esc(name)}">
      <span class="tw">${open?"▾":"▸"}</span>
      <b>${esc(name)}</b>
      <span class="gcount">${rows.length} prims${vol?" · "+vol.toPrecision(3):""}</span></div>`);
    if(open) sortRows(rows).forEach(r=>{
      out.push(`<div class="trow${SELECTED===r.path?" sel":""}" data-p="${esc(r.path)}">
        <span class="tw" style="margin-left:15px">·</span>
        <span class="tn">${esc(r.path)}</span>
        <span class="tt">${esc(r.type)}</span>
        <span class="tb">${r.bbox_volume==null?"":Number(r.bbox_volume).toPrecision(3)}</span></div>`);
    });
  });
  const pv = byId("pivot");
  pv.innerHTML = out.join("") || '<div class="muted" style="padding:14px">no groups</div>';
  pv.querySelectorAll(".ghead").forEach(el=>{ const g = el.dataset.g;
    el.onclick = ()=>{ GROUP_OPEN.has(g)?GROUP_OPEN.delete(g):GROUP_OPEN.add(g); render(); }; });
  pv.querySelectorAll(".trow").forEach(el=>{ const p = el.dataset.p;
    el.onclick = ()=>{ SELECTED = p; openCard(p); render(); }; });
}

function promptLoad(dim){
  byId("pivot").innerHTML =
    `<div class="muted" style="padding:16px;max-width:36rem">
      Organizing by <b style="color:var(--accent)">${dim}</b> needs the bound
      material of every prim — which sits behind payloads. That means loading
      the scene (expensive). <button id="doload">load &amp; organize</button></div>`;
  byId("doload").onclick = ()=>{
    byId("pivot").innerHTML = '<div class="muted" style="padding:16px">loading payloads &amp; computing bindings…</div>';
    ensureCols(DIM_COLS[dim], true).then(render);
  };
}

function render(){
  const dim = byId("organize-by").value;
  if(dim === "hierarchy") return renderHierarchy();
  if(EXPENSIVE[dim]){
    if(!COLS.has(DIM_COLS[dim][0])) return promptLoad(dim);
    return renderGroups(EXPENSIVE[dim]);
  }
  const need = DIM_COLS[dim];
  if(need && !need.every(c=>COLS.has(c)))
    return ensureCols(need, false).then(()=>renderGroups(CHEAP[dim]));
  return renderGroups(CHEAP[dim]);
}

const BASE_COLS = ["path", "type", "has_payload", "bbox_volume"];
let COLS = new Set(BASE_COLS);
function fetchRows(cols, load){
  const q = "columns=" + cols.join(",") + (load ? "&load=1" : "");
  return (S ? fetch("data.json") : fetch("/data?"+q)).then(r=>r.json());
}
function ensureCols(extra, load){
  (extra||[]).forEach(c=>COLS.add(c));
  return fetchRows([...COLS], load).then(d=>{
    ROWS = d.rows || [];
    byId("rowhint").textContent = ROWS.length + " prims";
    indexRows();
  });
}
function loadRows(){
  return ensureCols([], false).then(render).catch(e=>{ byId("pivot").innerHTML =
    '<div class="muted" style="padding:14px">could not load rows: '+esc(e)+'</div>'; });
}

// -- prim card (filled in Task 5; stub here) ---------------------------------
function openCard(p){
  const c = byId("card");
  byId("main").classList.add("cardopen");
  c.hidden = false;
  c.innerHTML = `<button class="cardclose" onclick="closeCard()">close</button>
    <h2>${esc(p.split("/").pop())}</h2><div class="muted">${esc(p)}</div>
    <div class="muted" style="margin-top:10px">prim card — details land in Task 5</div>`;
}
function closeCard(){
  byId("card").hidden = true;
  byId("main").classList.remove("cardopen");
  SELECTED = null; render();
}
window.closeCard = closeCard;

byId("organize-by").onchange = render;
byId("sortby").onchange = render;
loadRows();
</script>
</body>
</html>
