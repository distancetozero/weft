[project]
name = "jitsd"
version = "0.1.0"
description = "JIT-SD reference implementation -- rung 1: solo, offline, no contracts"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
# Both extras are optional by design: rung 1 must run with nothing installed.
#   numpy    a performance path only -- the pure-Python chunker produces
#            identical boundaries, just far slower.
#   usd-core real USD. When present it backs the .usda reader and validates
#            everything jitsd emits; when absent the fallback parser runs and
#            the pxr tests skip.
fast = ["numpy>=1.24"]
usd = ["usd-core>=24.0"]
# jinja2 is usdGenSchema's own dependency; CI regenerates the contract schema
# and diffs, so dev environments need to be able to run the generator.
dev = ["numpy>=1.24", "usd-core>=24.0", "pytest>=7", "jinja2>=3"]

[project.scripts]
jitsd = "jitsd.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Declared explicitly: this is a flat layout with several top-level directories
# (jitsd, bench, specs, docs, examples, tests), and setuptools auto-discovery
# refuses to guess between them -- `pip install -e .` fails outright without
# this. Caught by simulating the CI job from a clean clone.
[tool.setuptools]
packages = ["jitsd", "jitsd.generators"]

[tool.pytest.ini_options]
testpaths = ["tests"]
