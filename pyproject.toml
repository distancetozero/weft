[project]
name = "weft-usd"
version = "0.1.0"
description = "weft: see a USD stage as data -- derive relationships, query surgically, certify slices. Pull the thread, not the world."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Ashraf Ghoniem" }]
keywords = ["usd", "openusd", "pixar", "3d", "vfx", "scene-description", "data", "aousd"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/distancetozero/weft"
Repository = "https://github.com/distancetozero/weft"
Issues = "https://github.com/distancetozero/weft/issues"

[project.optional-dependencies]
# Both extras are optional by design: rung 1 must run with nothing installed.
#   numpy    a performance path only -- the pure-Python chunker produces
#            identical boundaries, just far slower.
#   usd-core real USD. When present it backs the .usda reader and validates
#            everything weft emits; when absent the fallback parser runs and
#            the pxr tests skip.
fast = ["numpy>=1.24"]
usd = ["usd-core>=24.0"]
# jinja2 is usdGenSchema's own dependency; CI regenerates the contract schema
# and diffs, so dev environments need to be able to run the generator.
dev = ["numpy>=1.24", "usd-core>=24.0", "pytest>=7", "jinja2>=3"]

[project.scripts]
weft = "weft.cli:main"
jitsd = "weft.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Declared explicitly: this is a flat layout with several top-level directories
# (weft, bench, specs, docs, examples, tests), and setuptools auto-discovery
# refuses to guess between them -- `pip install -e .` fails outright without
# this. Caught by simulating the CI job from a clean clone.
[tool.setuptools]
packages = ["weft", "weft.generators", "deps", "absent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
